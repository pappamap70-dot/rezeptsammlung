// Handy-Ansicht erzwingen – auch wenn der Browser im "Desktop-Modus" die viewport-Angabe ignoriert
(function () {
  var d = document.documentElement;
  function fit() {
    var w = window.innerWidth, sw = screen.width;
    var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    var z = touch && sw && sw <= 820 && w > sw * 1.3 ? w / sw : 1;
    d.style.zoom = z === 1 ? '' : z;
    var eff = w / z;
    d.classList.toggle('narrow', eff <= 820);
    d.classList.toggle('mobile', eff <= 720);
    d.classList.toggle('tiny', eff <= 480);
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
